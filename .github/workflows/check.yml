name: Build and check
# Manual only. Do not add push, pull_request, schedule, or another
# workflow that starts a GitHub-hosted runner on its own. Run the same
# checks locally with `npm run build` and `npm run check`.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - run: npm run build
      - run: npm run check
