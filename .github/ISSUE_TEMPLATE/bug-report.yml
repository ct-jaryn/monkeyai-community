name: Report a website issue
description: Report a problem with this community site or its content.
title: "[Website]: "
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, use the private reporting link in SECURITY.md. Do not include secrets or personal information."
  - type: input
    id: url
    attributes:
      label: Affected page URL
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened and how can we reproduce it?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device, if relevant
  - type: textarea
    id: sources
    attributes:
      label: Sources or additional context
      description: For content corrections, link to a reliable official source.
